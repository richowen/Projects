[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
@Include=#@#Variables.inc

[Metadata]
Name=ESP32 Air Quality Monitor
Author=Your Name
Version=1.0
License=Creative Commons Attribution-Non-Commercial-Share Alike 3.0
Information=Displays real-time air quality data from ESP32 via Home Assistant REST API

; =====================================
; Background
; =====================================
[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#WidgetWidth#,#WidgetHeight#,8 | Fill Color #ColorBackground# | StrokeWidth 0
X=0
Y=0
W=#WidgetWidth#
H=#WidgetHeight#

; =====================================
; Title Bar
; =====================================
[MeterTitle]
Meter=String
X=10
Y=10
FontFace=#FontFace#
FontSize=#TitleSize#
FontColor=#ColorText#
FontWeight=600
Text=🌫️ Air Quality Monitor
AntiAlias=1

[MeterDivider1]
Meter=Shape
Shape=Line 10,40,(#WidgetWidth#-10),40 | StrokeWidth 1 | Stroke Color 100,100,100,150

; =====================================
; Particulate Matter Section
; =====================================
[MeterPMTitle]
Meter=String
X=10
Y=50
FontFace=#FontFace#
FontSize=#FontSize#
FontColor=#ColorTextDim#
Text=Particulate Matter
AntiAlias=1

; --- PM1.0 ---
[MeasurePM1]
Measure=Plugin
Plugin=WebParser
URL=http://#HAHost#:#HAPort#/api/states/sensor.air_quality_pm1
Header=Authorization: Bearer #HAToken#
RegExp=(?siU)"state": "(.+?)"
UpdateRate=#UpdateRate#
FinishAction=[!UpdateMeter MeterPM1Value][!Redraw]

[MeterPM1Label]
Meter=String
X=20
Y=75
FontFace=#FontFace#
FontSize=#FontSize#
FontColor=#ColorText#
Text=PM1.0:
AntiAlias=1

[MeterPM1Value]
Meter=String
MeasureName=MeasurePM1
X=100
Y=75
FontFace=#FontFace#
FontSize=#ValueSize#
FontColor=#ColorText#
Text=%1 μg/m³
NumOfDecimals=0
AntiAlias=1
DynamicVariables=1

; --- PM2.5 ---
[MeasurePM25]
Measure=Plugin
Plugin=WebParser
URL=http://#HAHost#:#HAPort#/api/states/sensor.air_quality_pm25
Header=Authorization: Bearer #HAToken#
RegExp=(?siU)"state": "(.+?)"
UpdateRate=#UpdateRate#
FinishAction=[!UpdateMeter MeterPM25Value][!Redraw]

[MeterPM25Label]
Meter=String
X=20
Y=100
FontFace=#FontFace#
FontSize=#FontSize#
FontColor=#ColorText#
Text=PM2.5:
AntiAlias=1

[MeterPM25Value]
Meter=String
MeasureName=MeasurePM25
X=100
Y=100
FontFace=#FontFace#
FontSize=#ValueSize#
FontColor=(#MeasurePM25# <= #ThresholdGood# ? "#ColorExcellent#" : (#MeasurePM25# <= #ThresholdModerate# ? "#ColorModerate#" : "#ColorPoor#"))
Text=%1 μg/m³
NumOfDecimals=0
AntiAlias=1
DynamicVariables=1

[MeterPM25Bar]
Meter=Bar
MeasureName=MeasurePM25
X=200
Y=102
W=100
H=8
BarColor=(#MeasurePM25# <= #ThresholdGood# ? "#ColorExcellent#" : (#MeasurePM25# <= #ThresholdModerate# ? "#ColorModerate#" : "#ColorPoor#"))
BarOrientation=Horizontal
DynamicVariables=1

; --- PM10 ---
[MeasurePM10]
Measure=Plugin
Plugin=WebParser
URL=http://#HAHost#:#HAPort#/api/states/sensor.air_quality_pm10
Header=Authorization: Bearer #HAToken#
RegExp=(?siU)"state": "(.+?)"
UpdateRate=#UpdateRate#
FinishAction=[!UpdateMeter MeterPM10Value][!Redraw]

[MeterPM10Label]
Meter=String
X=20
Y=125
FontFace=#FontFace#
FontSize=#FontSize#
FontColor=#ColorText#
Text=PM10:
AntiAlias=1

[MeterPM10Value]
Meter=String
MeasureName=MeasurePM10
X=100
Y=125
FontFace=#FontFace#
FontSize=#ValueSize#
FontColor=#ColorText#
Text=%1 μg/m³
NumOfDecimals=0
AntiAlias=1
DynamicVariables=1

; =====================================
; Gases Section
; =====================================
[MeterDivider2]
Meter=Shape
Shape=Line 10,155,(#WidgetWidth#-10),155 | StrokeWidth 1 | Stroke Color 100,100,100,150

[MeterGasesTitle]
Meter=String
X=10
Y=165
FontFace=#FontFace#
FontSize=#FontSize#
FontColor=#ColorTextDim#
Text=Gas Concentrations
AntiAlias=1

; --- TVOC ---
[MeasureTVOC]
Measure=Plugin
Plugin=WebParser
URL=http://#HAHost#:#HAPort#/api/states/sensor.air_quality_tvoc
Header=Authorization: Bearer #HAToken#
RegExp=(?siU)"state": "(.+?)"
UpdateRate=#UpdateRate#
FinishAction=[!UpdateMeter MeterTVOCValue][!Redraw]

[MeterTVOCLabel]
Meter=String
X=20
Y=190
FontFace=#FontFace#
FontSize=#FontSize#
FontColor=#ColorText#
Text=TVOC:
AntiAlias=1

[MeterTVOCValue]
Meter=String
MeasureName=MeasureTVOC
X=100
Y=190
FontFace=#FontFace#
FontSize=#ValueSize#
FontColor=#ColorText#
Text=%1 ppb
NumOfDecimals=0
AntiAlias=1
DynamicVariables=1

; --- eCO2 ---
[MeasureECO2]
Measure=Plugin
Plugin=WebParser
URL=http://#HAHost#:#HAPort#/api/states/sensor.air_quality_eco2
Header=Authorization: Bearer #HAToken#
RegExp=(?siU)"state": "(.+?)"
UpdateRate=#UpdateRate#
FinishAction=[!UpdateMeter MeterECO2Value][!Redraw]

[MeterECO2Label]
Meter=String
X=20
Y=215
FontFace=#FontFace#
FontSize=#FontSize#
FontColor=#ColorText#
Text=eCO2:
AntiAlias=1

[MeterECO2Value]
Meter=String
MeasureName=MeasureECO2
X=100
Y=215
FontFace=#FontFace#
FontSize=#ValueSize#
FontColor=#ColorText#
Text=%1 ppm
NumOfDecimals=0
AntiAlias=1
DynamicVariables=1

; --- CO ---
[MeasureCO]
Measure=Plugin
Plugin=WebParser
URL=http://#HAHost#:#HAPort#/api/states/sensor.air_quality_co
Header=Authorization: Bearer #HAToken#
RegExp=(?siU)"state": "(.+?)"
UpdateRate=#UpdateRate#
FinishAction=[!UpdateMeter MeterCOValue][!Redraw]

[MeterCOLabel]
Meter=String
X=20
Y=240
FontFace=#FontFace#
FontSize=#FontSize#
FontColor=#ColorText#
Text=CO:
AntiAlias=1

[MeterCOValue]
Meter=String
MeasureName=MeasureCO
X=100
Y=240
FontFace=#FontFace#
FontSize=#ValueSize#
FontColor=#ColorText#
Text=%1 ppm
NumOfDecimals=2
AntiAlias=1
DynamicVariables=1

; --- O2 ---
[MeasureO2]
Measure=Plugin
Plugin=WebParser
URL=http://#HAHost#:#HAPort#/api/states/sensor.air_quality_o2
Header=Authorization: Bearer #HAToken#
RegExp=(?siU)"state": "(.+?)"
UpdateRate=#UpdateRate#
FinishAction=[!UpdateMeter MeterO2Value][!Redraw]

[MeterO2Label]
Meter=String
X=20
Y=265
FontFace=#FontFace#
FontSize=#FontSize#
FontColor=#ColorText#
Text=O2:
AntiAlias=1

[MeterO2Value]
Meter=String
MeasureName=MeasureO2
X=100
Y=265
FontFace=#FontFace#
FontSize=#ValueSize#
FontColor=#ColorText#
Text=%1 %
NumOfDecimals=2
AntiAlias=1
DynamicVariables=1

; =====================================
; Air Quality Index
; =====================================
[MeterDivider3]
Meter=Shape
Shape=Line 10,295,(#WidgetWidth#-10),295 | StrokeWidth 1 | Stroke Color 100,100,100,150

[MeasureAQI]
Measure=Plugin
Plugin=WebParser
URL=http://#HAHost#:#HAPort#/api/states/sensor.air_quality_aqi
Header=Authorization: Bearer #HAToken#
RegExp=(?siU)"state": "(.+?)"
UpdateRate=#UpdateRate#
FinishAction=[!UpdateMeter MeterAQIValue][!Redraw]

[MeterAQILabel]
Meter=String
X=10
Y=310
FontFace=#FontFace#
FontSize=12
FontColor=#ColorTextDim#
Text=Air Quality Index
AntiAlias=1

[MeterAQIValue]
Meter=String
MeasureName=MeasureAQI
X=10
Y=335
FontFace=#FontFace#
FontSize=28
FontWeight=700
FontColor=(#MeasureAQI# = 1 ? "#ColorExcellent#" : (#MeasureAQI# = 2 ? "#ColorGood#" : (#MeasureAQI# = 3 ? "#ColorModerate#" : (#MeasureAQI# = 4 ? "#ColorPoor#" : "#ColorVeryPoor#"))))
Text=%1
NumOfDecimals=0
AntiAlias=1
DynamicVariables=1

[MeterAQIText]
Meter=String
MeasureName=MeasureAQI
X=60
Y=345
FontFace=#FontFace#
FontSize=14
FontColor=#ColorText#
Text=(#MeasureAQI# = 1 ? "Excellent" : (#MeasureAQI# = 2 ? "Good" : (#MeasureAQI# = 3 ? "Moderate" : (#MeasureAQI# = 4 ? "Poor" : "Very Poor"))))
AntiAlias=1
DynamicVariables=1

; =====================================
; Update Timestamp
; =====================================
[MeasureUpdateTime]
Measure=Plugin
Plugin=WebParser
URL=[MeasurePM25]
RegExp=(?siU)"last_updated": "(.+?)"
StringIndex=1
UpdateRate=#UpdateRate#

[MeterLastUpdate]
Meter=String
X=10
Y=385
FontFace=#FontFace#
FontSize=8
FontColor=#ColorTextDim#
Text=Last updated: %1
AntiAlias=1
DynamicVariables=1

; =====================================
; Connection Status Indicator
; =====================================
[MeterConnectionStatus]
Meter=String
X=10
Y=400
FontFace=#FontFace#
FontSize=8
FontColor=(#MeasurePM25# = 0 ? "#ColorVeryPoor#" : "#ColorExcellent#")
Text=(#MeasurePM25# = 0 ? "⚠ No Connection" : "● Connected")
AntiAlias=1
DynamicVariables=1
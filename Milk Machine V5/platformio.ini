; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:firebeetle32]
platform   = espressif32
board      = firebeetle32
framework  = arduino

monitor_speed = 115200

upload_protocol = espota
upload_port     = 192.168.1.16
upload_flags    =
    --host_port=3232

lib_deps =
    ; Pre-staged for future SSE/WebSocket upgrade — uncomment when implementing:
    ;   esphome/ESPAsyncWebServer-esphome@^3.1.0

; ------------------------------------------------------------------
; Native unit-test environment — runs on the PC host, no hardware.
; Tests live in test/test_* directories and exercise machine_core and
; level_debouncer via Unity. Run with:  pio test -e native
; ------------------------------------------------------------------
[env:native]
platform      = native
test_framework = unity
build_flags   =
    -std=gnu++17
    -DUNIT_TEST
    -I src
; Only compile the hardware-free modules when running native tests.
; main.cpp, remote_monitor.*, etc. pull in Arduino/WiFi and cannot build on host.
build_src_filter = -<*> +<machine_core.cpp> +<level_debouncer.cpp>
test_build_src   = yes
; Auto-discover MinGW-w64 on Windows so `pio test -e native` works without
; needing a freshly-restarted shell after installing the compiler.
extra_scripts    = pre:scripts/native_path.py

